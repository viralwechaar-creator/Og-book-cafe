<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Invoice</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111;margin:0;background:#f4f4f4}
.wrap{max-width:700px;margin:0 auto;padding:0 24px 40px}
.bar{display:flex;justify-content:flex-end;padding:16px 24px;position:sticky;top:0;background:#f4f4f4}
.bar button{font:15px inherit;padding:10px 16px;border-radius:6px;border:1px solid #111;background:#111;color:#fff;cursor:pointer}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.mark img{max-height:48px}.mark{font-size:22px;font-weight:700}.ttl{font-size:22px;letter-spacing:2px;font-weight:700;color:#555}
.meta{display:flex;justify-content:space-between;margin-bottom:18px;font-size:13px;color:#333}.meta .r{text-align:right}
table{width:100%;border-collapse:collapse;margin:14px 0}th,td{padding:8px 4px;text-align:left;border-bottom:1px solid #ddd;font-size:13px}th{font-size:12px;color:#666;font-weight:600;text-transform:uppercase;letter-spacing:.5px}th.c,td.c{text-align:center}th.r,td.r{text-align:right}
.tot{display:grid;justify-content:end;margin-top:6px}.tot div{display:grid;grid-template-columns:140px 100px;gap:20px;padding:3px 0;font-size:13px;color:#333}.tot div b:first-child{font-weight:600;color:#111}.tot .big{font-size:17px;border-top:1px solid #111;margin-top:6px;padding-top:8px;color:#111}
.thanks{font-size:18px;margin:32px 0 36px;color:#111}
.ft{display:flex;justify-content:space-between;font-size:12px;color:#444}.sig{text-align:right}
.err{padding:60px 20px;text-align:center}
@media print{.bar{display:none}body{background:#fff}}
</style></head><body>
<div class=bar><button onclick="print()">Print / Download</button></div>
<div class=wrap id=a>Loading…</div>
<script src=https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin=anonymous></script><script src=/config.js></script><script>
const sb=supabase.createClient(CFG.url,CFG.key),A=document.getElementById('a'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),r2=n=>Math.round(n*100)/100,inr=n=>'₹'+r2(n).toLocaleString('en-IN');
const id=new URLSearchParams(location.search).get('o');
(async()=>{
 if(!id)return A.innerHTML='<div class=err>Invoice not found.</div>';
 const{data,error}=await sb.rpc('public_invoice',{oid:id});
 if(error||!data||!data.order)return A.innerHTML='<div class=err>Invoice not found.</div>';
 const o=data.order,s=data.cfg||{},t=o.t,logo=s.logo||'/logo.png';
 const rows=o.lines.map(l=>`<tr><td>${esc(l.name)}${l.size?' ('+esc(l.size)+')':''}</td><td class=c>${l.qty}</td><td class=r>${inr(l.price)}</td><td class=r>${inr(l.price*l.qty)}</td></tr>`).join('');
 A.innerHTML=`<div class=hd><div class=mark><img src="${esc(logo)}" onerror="this.replaceWith(document.createTextNode('${esc((s.name||'?').charAt(0))}'))"></div><div class=ttl>INVOICE</div></div>
<div class=meta><div><b>BILLED TO:</b><br>${esc((o.cust||{}).name)}<br>${esc((o.cust||{}).phone)}</div><div class=r><b>Invoice No.</b> ${esc(o.no)}<br>${new Date(o.paidAt||o.created).toLocaleDateString()}</div></div>
<table><thead><tr><th>Item</th><th class=c>Quantity</th><th class=r>Unit Price</th><th class=r>Total</th></tr></thead><tbody>${rows}</tbody></table>
<div class=tot><div><b>Subtotal</b><span>${inr(t.sub)}</span></div>${t.d?`<div><b>Discount</b><span>-${inr(t.d)}</span></div>`:''}<div><b>CGST</b><span>${inr(t.tax/2)}</span></div><div><b>SGST</b><span>${inr(t.tax/2)}</span></div><div class=big><b>Total</b><b>${inr(t.total)}</b></div></div>
<p class=thanks>${esc(s.ftr||'Thank you!')}</p>
<div class=ft><div><b>PAID VIA</b><br>${(o.pays||[]).map(p=>p.m.toUpperCase()+': '+inr(p.amt)).join('<br>')||'—'}</div><div class=sig><b>${esc(s.name)}</b><br>${esc(s.addr)}${s.gstin?'<br>GSTIN '+esc(s.gstin):''}</div></div>`;
})();
</script></body></html>
