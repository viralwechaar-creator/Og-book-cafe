<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Order</title>
<style>body{margin:0;font:16px system-ui,sans-serif;background:#f3f4ef;color:#1d211c;padding-bottom:90px}header{padding:16px;background:var(--g,#1f3d2e);color:#fff}h1{margin:0;font-size:21px}header p{margin:4px 0 0;opacity:.9;font-size:14px}.c{display:flex;gap:8px;overflow:auto;padding:10px;position:sticky;top:0;background:#f3f4ef}.c button{white-space:nowrap}button,input,textarea{font:inherit;padding:10px 12px;border:1px solid #c5c9bf;border-radius:10px;background:#fff;color:inherit}button.on,button.p{background:var(--g,#1f3d2e);color:#fff;border-color:var(--g,#1f3d2e)}.i{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;margin:8px 10px;padding:12px;border-radius:12px;border:1px solid #dcdfd6}.q{white-space:nowrap}.q button{width:40px;padding:8px}.bar{position:fixed;left:0;right:0;bottom:0;padding:10px;background:#fff;border-top:1px solid #dcdfd6}.bar button{width:100%}.m{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end}.m>div{background:#fff;width:100%;padding:16px;border-radius:16px 16px 0 0;display:grid;gap:8px;max-height:92vh;overflow:auto}.r{display:flex;justify-content:space-between}.ok{padding:40px 20px;text-align:center}</style></head><body><div id=a>Loading…</div>
<script src=https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin=anonymous></script><script src=/config.js></script><script>
const sb=supabase.createClient(CFG.url,CFG.key),T=new URLSearchParams(location.search).get('t'),A=document.getElementById('a'),cart={},inr=n=>'₹'+Math.round(n*100)/100,esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let M,cat,tb,me={n:'',p:'',t:''};
const price=k=>{const j=k.indexOf('|'),i=M.items.find(x=>x.id==k.slice(0,j)),sz=k.slice(j+1),s=sz&&(i.sizes||[]).find(x=>x.l==sz);return[i,sz,s?s.p:i.price]};
(async()=>{const{data,error}=await sb.rpc('public_menu');if(error||!data){A.textContent='Menu unavailable. Please ask our staff.';return}M=data;tb=M.tables.find(x=>x.id==T);if(!tb){A.textContent='Invalid table QR. Please ask our staff.';return}if(M.cfg&&M.cfg.col)document.documentElement.style.setProperty('--g',M.cfg.col);M.cats.sort((a,b)=>a.n-b.n);cat=(M.cats[0]||{}).id;draw()})();
function chg(k,d){const[i,sz,p]=price(k),c=cart[k]||(cart[k]={id:i.id,size:sz,q:0});c.q=Math.max(0,c.q+d);if(!c.q)delete cart[k];draw()}
const tot=()=>{let s=0,n=0;for(const k in cart){s+=price(k)[2]*cart[k].q;n+=cart[k].q}return{n,s,t:s*(1+(+(M.cfg||{}).tax||0)/100)}};
function draw(){const rows=[];M.items.filter(i=>!i.off&&i.cat==cat).sort((a,b)=>a.name.localeCompare(b.name)).forEach(i=>{(i.sizes&&i.sizes.length?i.sizes.map(s=>[s.l,s.p]):[['',i.price]]).forEach(([sz,p])=>{const k=esc(i.id+'|'+sz),q=(cart[i.id+'|'+sz]||{}).q||0;rows.push(`<div class=i><div><b>${esc(i.name)}</b> ${esc(sz)}<br>${inr(p)}</div><div class=q><button data-k="${k}" onclick="chg(this.dataset.k,-1)">−</button> <b>${q}</b> <button data-k="${k}" onclick="chg(this.dataset.k,1)">+</button></div></div>`)})});const t=tot();
A.innerHTML=`<header><h1>${esc((M.cfg||{}).name||'Menu')}</h1><p>${esc(tb.name)} · ${esc((M.cfg||{}).gw||'')}</p></header><div class=c>${M.cats.map(c=>`<button class="${c.id==cat?'on':''}" data-k="${esc(c.id)}" onclick="cat=this.dataset.k;draw()">${esc(c.name)}</button>`).join('')}</div>${rows.join('')||'<p style="padding:14px">Nothing here yet.</p>'}${t.n?`<div class=bar><button class=p onclick=review()>View order (${t.n}) · ${inr(t.t)}</button></div>`:''}`}
function review(){const t=tot(),d=document.createElement('div');d.className='m';d.innerHTML=`<div><h3 style="margin:0">Your order · ${esc(tb.name)}</h3>${Object.keys(cart).map(k=>{const[i,sz,p]=price(k);return`<div class=r><span>${cart[k].q}× ${esc(i.name)} ${esc(sz)}</span><span>${inr(p*cart[k].q)}</span></div>`}).join('')}<div class=r><b>Estimated total (incl. taxes)</b><b>${inr(t.t)}</b></div><input id=n placeholder="Your name *" value="${esc(me.n)}"><input id=p type=tel placeholder="Mobile number *" value="${esc(me.p)}"><textarea id=nt placeholder="Notes (e.g. less spicy, no onion)"></textarea><button class=p id=go>Place order</button><button id=cx>Back</button></div>`;document.body.append(d);d.querySelector('#cx').onclick=()=>d.remove();d.querySelector('#go').onclick=async e=>{const n=d.querySelector('#n').value.trim(),p=d.querySelector('#p').value.trim();if(!n)return alert('Please enter your name');if(!p)return alert('Please enter your mobile number');me={n,p};e.target.disabled=true;const{error}=await sb.rpc('place_order',{t:T,n,p,nt:d.querySelector('#nt').value.trim(),its:Object.values(cart).map(c=>({id:c.id,size:c.size,qty:c.q}))});if(error){e.target.disabled=false;return alert(/busy/.test(error.message)?'Too many pending orders for this table. Please call our staff.':'Could not place the order. Please try again or call our staff.')}for(const k in cart)delete cart[k];d.remove();A.innerHTML=`<div class=ok><h1>✅ Order sent!</h1><p>Thank you ${esc(n)}. Our staff will confirm it shortly.</p><button class=p onclick=draw()>Order more</button></div>`}}
</script></body></html>
